services:
  postgres:
    image: postgres:17-alpine
    container_name: ayudalocal-postgres
    environment:
      POSTGRES_DB: ayudalocal_db
      POSTGRES_USER: ayudalocal_user
      POSTGRES_PASSWORD: ayudalocal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ayudalocal.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
